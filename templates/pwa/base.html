<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1A365C" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>{% block title %}{{ brand_name }}{% endblock %}</title>
  {% if pwa_enabled %}
  <link rel="manifest" href="/m/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/static/pwa/icons/icon-192.png" />
  {% endif %}
  <link rel="stylesheet" href="/static/pwa/app.css" />
  {% block head %}{% endblock %}
</head>
<body class="pwa-body {% block body_class %}{% endblock %}">
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
