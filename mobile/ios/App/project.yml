name: PortalMembro
options:
  bundleIdPrefix: org.orchestra
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
packages:
  PortalMobile:
    path: ..
targets:
  PortalMembro:
    type: application
    platform: iOS
    sources:
      - path: PortalMembro
    dependencies:
      - package: PortalMobile
        product: PortalMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.orchestra.portal.membro
        PRODUCT_NAME: PortalMembro
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: PortalMembro/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Portal
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - PortalMembroTests
      gatherCoverageData: false
  PortalMembroTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PortalMembroTests
    dependencies:
      - target: PortalMembro
      - package: PortalMobile
        product: PortalMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.orchestra.portal.membro.tests
        GENERATE_INFOPLIST_FILE: YES
